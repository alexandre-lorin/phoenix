[project]
name = "phoenix"
version = "0.7.0"
description = "Git-backed Arch Linux configuration snapshots and restore tooling."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
phoenix = "phoenix.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["phoenix"]
